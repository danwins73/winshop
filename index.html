<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WinShop - Betting Companion</title>
  
  <!-- PWA & iOS Home Screen Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WinShop">
  <meta name="theme-color" content="#0d3b2e">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/trophy.png">
  
  <!-- Manifest JSON Data URI -->
  <link rel="manifest" href='data:application/json,{"name":"WinShop","short_name":"WinShop","start_url":".","display":"standalone","background_color":"#0d3b2e","theme_color":"#0d3b2e","icons":[{"src":"https://img.icons8.com/color/192/trophy.png","sizes":"192x192","type":"image/png"}]}'>

  <style>
    :root {
      --bg-color: #061c16;
      --card-bg: #0d3b2e;
      --gold: #dfb15b;
      --text: #ffffff;
      --text-muted: #a3b8b0;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      background: var(--card-bg);
      padding: 20px 0;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      border-bottom: 2px solid var(--gold);
    }
    h1 {
      margin: 0;
      color: var(--gold);
      font-size: 1.8rem;
      letter-spacing: 1px;
    }
    .container {
      width: 90%;
      max-width: 500px;
      margin-top: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      border: 1px solid rgba(223, 177, 91, 0.2);
    }
    .card h2 {
      margin-top: 0;
      color: var(--gold);
      font-size: 1.2rem;
    }
    .odds-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .btn {
      width: 100%;
      background: var(--gold);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>WINSHOP</h1>
  </header>
  <div class="container">
    <div class="card">
      <h2>Live Match Odds</h2>
      <div class="odds-row">
        <span>Team A vs Team B</span>
        <strong style="color: var(--gold);">1.85 | 3.40</strong>
      </div>
      <button class="btn" onclick="alert('Odds updated!')">Refresh Odds</button>
    </div>
  </div>
</body>
</html>
